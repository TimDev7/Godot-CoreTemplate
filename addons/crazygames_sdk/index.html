<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
        <title>$GODOT_PROJECT_NAME</title>
        <style>
            html, body, #canvas {
                margin: 0;
                padding: 0;
                border: 0;
            }

            body {
                color: white;
                background-color: black;
                overflow: hidden;
                touch-action: none;
            }

            #canvas {
                display: block;
            }

            #canvas:focus {
                outline: none;
            }

            #status, #status-splash, #status-progress {
                position: absolute;
                left: 0;
                right: 0;
            }

            #status, #status-splash {
                top: 0;
                bottom: 0;
            }

            #status {
                background-color: #242424;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                visibility: hidden;
            }

            #status-splash {
                max-height: 100%;
                max-width: 100%;
                margin: auto;
            }

            #status-progress, #status-notice {
                display: none;
            }

            #status-progress {
                bottom: 10%;
                width: 50%;
                margin: 0 auto;
            }

            #status-notice {
                background-color: #5b3943;
                border-radius: 0.5rem;
                border: 1px solid #9b3943;
                color: #e0e0e0;
                font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
                line-height: 1.3;
                margin: 0 2rem;
                overflow: hidden;
                padding: 1rem;
                text-align: center;
                z-index: 1;
            }

        </style>
        <!-- Loaded before Godot's own engine script (below) so
             window.CrazyGames exists by the time crazygames.gd's autoload
             _ready() looks for it via JavaScriptBridge.get_interface().
             URL confirmed against docs.crazygames.com/sdk/intro directly,
             not memory. -->
        <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
        $GODOT_HEAD_INCLUDE
    </head>
    <body>
        <canvas id="canvas">
            Your browser does not support the canvas tag.
        </canvas>

        <noscript>
            Your browser does not support JavaScript.
        </noscript>

        <div id="status">
            <img id="status-splash" src="$GODOT_SPLASH" alt="">
            <progress id="status-progress"></progress>
            <div id="status-notice"></div>
        </div>

        <script src="$GODOT_URL"></script>
        <script>
            const GODOT_CONFIG = $GODOT_CONFIG
            const ENGINE = new Engine(GODOT_CONFIG)
            const CANVAS = document.getElementById('canvas')

            // CrazyGames' own loading requirements (docs.crazygames.com/sdk/game)
            // say loadingStart()/loadingStop() aren't required for Godot -
            // "loading is done via the Godot export" - so this is just the
            // engine's own normal boot, no extra SDK calls needed here.
            // SDK.init() itself happens in crazygames.gd's autoload _ready(),
            // which runs once Godot's own script (loaded above) starts the
            // engine and autoloads spin up - not blocked on here.
            ENGINE.startGame({
                onProgress: function (current, total) {
                    if (!total) return
                    const progress = document.getElementById('status-progress')
                    progress.value = current
                    progress.max = total
                },
            }).then(() => {
                CANVAS.focus()
            })
        </script>

    </body>
</html>
